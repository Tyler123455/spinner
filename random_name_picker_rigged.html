<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Name Picker</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    color: #fff;
    padding-top: 20px;
}
h2 {
    margin-bottom: 20px;
}
input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
}
button {
    background: #ff9933;
    color: #222;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background: #ffcc66;
}
#nameDisplay {
    margin-top: 40px;
    font-size: 48px;
    font-weight: bold;
    color: #ffcc33;
    min-height: 60px;
    transition: color 0.2s;
}
#nameList {
    margin-top: 20px;
    width: 80%;
    max-width: 400px;
    background: #333;
    padding: 10px;
    border-radius: 10px;
    color: #fff;
}
#nameList ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
#nameList li {
    padding: 5px 0;
    border-bottom: 1px solid #555;
}
#winnerScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffcc33;
    font-size: 72px;
    font-weight: bold;
    flex-direction: column;
    z-index: 100;
    display: none;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>Random Name Picker</h2>
<input type="text" id="nameInput" placeholder="Type name">
<button onclick="addName()">Add Name</button>
<button onclick="deleteName()">Delete Name</button>
<button onclick="startPicker()">Start</button>

<div id="nameDisplay"></div>

<div id="nameList">
    <strong>Added Names:</strong>
    <ul id="list"></ul>
</div>

<div id="winnerScreen">
    <div id="winnerName"></div>
</div>

<script>
let names = [];
const RIGGED_NAME = "Showrob";
let rigOnce = true;

function updateNameList() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    names.forEach(name => {
        const li = document.createElement('li');
        li.textContent = name;
        list.appendChild(li);
    });
}

function addName() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (name !== '') {
        names.push(name);
        input.value = '';
        updateNameList();
    }
}

function deleteName() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (name !== '') {
        const index = names.findIndex(n => n.toLowerCase() === name.toLowerCase());
        if (index !== -1) {
            names.splice(index, 1);
            updateNameList();
        } else {
            alert('Name not found');
        }
        input.value = '';
    }
}

function getRandomColor() {
    const colors = ['#ff3333','#33ff33','#3333ff','#ffcc33','#ff33ff','#33ffff'];
    return colors[Math.floor(Math.random()*colors.length)];
}

function startPicker() {
    if (names.length === 0) {
        alert('Add some names first!');
        return;
    }

    document.getElementById('nameInput').style.display = 'none';
    document.querySelectorAll('button').forEach(btn => btn.style.display = 'none');
    document.getElementById('nameList').style.display = 'none';

    let display = document.getElementById('nameDisplay');
    let interval = null;
    let timeElapsed = 0;
    const totalTime = 3000 + Math.random() * 2000;
    const cycleSpeed = 300;

    interval = setInterval(() => {
        let currentName = names[Math.floor(Math.random() * names.length)];
        display.textContent = currentName;
        display.style.color = getRandomColor();
        timeElapsed += cycleSpeed;
        if (timeElapsed >= totalTime) {
            clearInterval(interval);
            let winner;
            if (rigOnce && names.some(n => n.toLowerCase() === RIGGED_NAME.toLowerCase())) {
                winner = RIGGED_NAME;
                rigOnce = false;
            } else {
                winner = names[Math.floor(Math.random() * names.length)];
            }
            showWinner(winner);
        }
    }, cycleSpeed);
}

function showWinner(winner) {
    const winnerScreen = document.getElementById('winnerScreen');
    document.getElementById('winnerName').textContent = winner;
    winnerScreen.style.display = 'flex';
    document.getElementById('nameDisplay').textContent = '';
}

// Close winner screen when anywhere is tapped
document.getElementById('winnerScreen').addEventListener('click', function() {
    const winnerScreen = document.getElementById('winnerScreen');
    winnerScreen.style.display = 'none';
    document.getElementById('nameInput').style.display = 'inline';
    document.querySelectorAll('button').forEach(btn => btn.style.display = 'inline');
    document.getElementById('nameList').style.display = 'block';
});
</script>

</body>
</html>
