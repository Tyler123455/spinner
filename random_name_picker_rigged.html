<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Name Picker</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    color: #fff;
    padding-top: 20px;
}
h2 {
    margin-bottom: 20px;
}
input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
}
button {
    background: #ff9933;
    color: #222;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background: #ffcc66;
}
#nameDisplay {
    margin-top: 40px;
    font-size: 48px;
    font-weight: bold;
    color: #ffcc33;
    min-height: 60px;
}
#nameList {
    margin-top: 20px;
    width: 80%;
    max-width: 400px;
    background: #333;
    padding: 10px;
    border-radius: 10px;
    color: #fff;
}
#nameList ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
#nameList li {
    padding: 5px 0;
    border-bottom: 1px solid #555;
}
</style>
</head>
<body>

<h2>Random Name Picker</h2>
<input type="text" id="nameInput" placeholder="Type name">
<button onclick="addName()">Add Name</button>
<button onclick="deleteName()">Delete Name</button>
<button onclick="startPicker()">Start</button>

<div id="nameDisplay"></div>

<div id="nameList">
    <strong>Added Names:</strong>
    <ul id="list"></ul>
</div>

<script>
let names = [];
const RIGGED_NAME = "Showrob";
let rigOnce = true;

function updateNameList() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    names.forEach(name => {
        const li = document.createElement('li');
        li.textContent = name;
        list.appendChild(li);
    });
}

function addName() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (name !== '') {
        names.push(name);
        input.value = '';
        updateNameList();
    }
}

function deleteName() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (name !== '') {
        const index = names.findIndex(n => n.toLowerCase() === name.toLowerCase());
        if (index !== -1) {
            names.splice(index, 1);
            updateNameList();
        } else {
            alert('Name not found');
        }
        input.value = '';
    }
}

function startPicker() {
    if (names.length === 0) {
        alert('Add some names first!');
        return;
    }

    let display = document.getElementById('nameDisplay');
    let interval = null;
    let timeElapsed = 0;
    const totalTime = 3000 + Math.random() * 2000; // cycle 3-5 seconds
    const cycleSpeed = 300; // 0.3 seconds per name

    interval = setInterval(() => {
        let currentName;
        if (rigOnce && names.some(n => n.toLowerCase() === RIGGED_NAME.toLowerCase())) {
            currentName = names[Math.floor(Math.random() * names.length)];
        } else {
            currentName = names[Math.floor(Math.random() * names.length)];
        }
        display.textContent = currentName;
        timeElapsed += cycleSpeed;
        if (timeElapsed >= totalTime) {
            clearInterval(interval);
            // Final winner
            let winner;
            if (rigOnce && names.some(n => n.toLowerCase() === RIGGED_NAME.toLowerCase())) {
                winner = RIGGED_NAME;
                rigOnce = false;
            } else {
                winner = names[Math.floor(Math.random() * names.length)];
            }
            display.textContent = winner;
        }
    }, cycleSpeed);
}
</script>

</body>
</html>
